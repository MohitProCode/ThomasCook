# Render Blueprint — hotel-booking backend (stateless, no disk needed).
# DB lives outside Render: point DB_* at Oracle Always Free HeatWave/MySQL
# or any reachable MySQL 8. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: hotel-booking-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: hotel_booking
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NUITEE_ENABLED
        value: true
      - key: NUITEE_API_KEY
        sync: false
      - key: JAVA_OPTS
        value: -Xmx380m -XX:+UseSerialGC
