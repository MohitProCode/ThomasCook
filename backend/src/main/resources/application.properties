# Hotel Booking Portal — backend configuration.
# Every secret/host value is overridable via environment variables; no secrets are committed.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
# PORT first so hosts like Render (which inject PORT=10000) work with zero config.
server.port=${PORT:${SERVER_PORT:8082}}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:hotel_booking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:hotel}
spring.datasource.password=${DB_PASSWORD:hotel}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Inventory is supplier-backed; no local demo seed data is loaded.
spring.sql.init.mode=never

spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Comma-separated list of allowed frontend origins for CORS.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000,http://localhost:5173}
app.currency=INR

# Nuitee Connect is the only supported hotel provider.
nuitee.enabled=${NUITEE_ENABLED:false}
nuitee.base-url=${NUITEE_BASE_URL:https://api.liteapi.travel}
nuitee.booking-base-url=${NUITEE_BOOKING_BASE_URL:https://book.liteapi.travel}
nuitee.api-key=${NUITEE_API_KEY:}
nuitee.guest-nationality=${NUITEE_GUEST_NATIONALITY:IN}

# Set JWT_SECRET to a random value of at least 32 characters in every deployed environment.
security.jwt-secret=${JWT_SECRET:}
security.jwt-ttl-minutes=${JWT_TTL_MINUTES:60}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail-from=${MAIL_FROM:no-reply@thomascook.example}

